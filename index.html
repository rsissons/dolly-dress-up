<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dolly Dress-Up</title>
<style>
:root{
  --bg1:#ffe3f1; --bg2:#e6e1ff; --card:#ffffff; --line:#f0e4ff; --hot:#ff5c8a;
  --ink:#5b3a73; --soft:#fbf7ff; --shadow:rgba(120,60,160,.18);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:system-ui,-apple-system,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(330px,44%);gap:14px;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
@media (max-aspect-ratio:1/1){ #app{grid-template-columns:1fr;grid-template-rows:54% 1fr;gap:10px;padding:10px 10px max(10px,env(safe-area-inset-bottom))} }
#stage{position:relative;border-radius:28px;overflow:hidden;box-shadow:0 8px 28px var(--shadow);touch-action:none;background:#fff}
#bg,#doll,#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#bobG{animation:bob 3.2s ease-in-out infinite}
#doll.still #bobG{animation:none}
@keyframes bob{50%{transform:translateY(-5px)}}
#jumpG{transform-origin:200px 660px}
#jumpG.jump{animation:jump .55s ease-out}
@keyframes jump{0%{transform:none}30%{transform:translateY(-16px) scale(1.02,.99)}60%{transform:translateY(0) scale(1.01,.98)}100%{transform:none}}
.eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.fab{position:absolute;width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.92);
  box-shadow:0 4px 14px var(--shadow);display:grid;place-items:center;padding:0;z-index:3}
.fab svg{width:40px;height:40px}
.fab:active{transform:scale(.9)}
#fSound{top:12px;left:12px} #fWand{top:12px;right:12px} #fExit{top:12px;right:12px} #fSnap{bottom:12px;right:12px}
#fWand svg{animation:wand 2.4s ease-in-out infinite}
@keyframes wand{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#panel{background:var(--card);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 28px var(--shadow);min-height:0}
#tabs{display:flex;justify-content:space-around;gap:4px;padding:10px 8px;background:var(--soft);border-bottom:3px solid var(--line)}
.tab{flex:1 1 0;max-width:64px;min-width:0;height:62px;border-radius:20px;border:none;background:transparent;display:grid;place-items:center;padding:0;transition:transform .15s}
.tab.on{background:#fff;box-shadow:0 4px 12px rgba(255,92,138,.3);transform:scale(1.08)}
.tab svg{width:42px;height:42px}
#content{flex:1;overflow-y:auto;padding:12px 14px 22px;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 8px;margin-bottom:8px}
.chip{flex:0 0 auto;width:62px;height:62px;border-radius:18px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.chip.on{border-color:var(--hot);background:#fff0f6}
.chip svg{width:42px;height:42px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.grid.big{grid-template-columns:repeat(2,1fr)}
.tile{aspect-ratio:1;border-radius:22px;border:3px solid var(--line);background:var(--soft);padding:6px;display:grid;place-items:center;position:relative}
.tile.tall{aspect-ratio:3/4;padding:3px;overflow:hidden}
.tile svg{width:100%;height:100%;display:block}
.tile.on{border-color:var(--hot);background:#fff0f6;box-shadow:0 0 0 4px rgba(255,92,138,.18)}
.tile.snap{background:#fff4c9;border-color:#ffd93d}
.tile:active,.chip:active,.sw:active,.tab:active{transform:scale(.92)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:3px dashed var(--line)}
.sw{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0;overflow:hidden;background:#fff}
.sw.on{box-shadow:0 0 0 4px var(--hot),0 2px 8px rgba(0,0,0,.18)}
.sw svg{width:100%;height:100%;display:block}
.gap{height:14px}
.spark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(170deg);opacity:0}}
.bub{animation:bub .9s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes bub{0%{transform:scale(.3);opacity:.95}100%{transform:translateY(-38px) scale(1.25);opacity:0}}
.gone{animation:gone .45s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes gone{to{transform:scale(1.5);opacity:0}}
.wiggle{animation:wig 1.1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translate(-16px,0) rotate(-8deg)}50%{transform:translate(16px,8px) rotate(8deg)}}
.drop{animation:drop 1.1s ease-in forwards}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}15%{opacity:.9}100%{transform:translateY(330px);opacity:0}}
.twinkle{animation:twk 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}
.wag{animation:wag .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
@keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(10deg)}}
.petHop.hop{animation:hop .5s ease-out}
@keyframes hop{40%{transform:translateY(-22px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div id="app">
  <div id="stage">
    <svg id="bg" viewBox="0 0 800 700" preserveAspectRatio="xMidYMax slice"></svg>
    <svg id="doll" viewBox="-20 -8 440 688" preserveAspectRatio="xMidYMid meet">
      <g id="bobG"><g id="jumpG">
        <g id="L-back"></g><g id="L-body"></g><g id="L-clothes"></g><g id="L-hands"></g><g id="L-face"></g>
        <g id="dirt"></g><g id="L-hairF"></g><g id="frizz"></g><g id="L-hat"></g>
      </g></g>
      <g id="L-pet"></g><g id="L-petfx"></g>
    </svg>
    <svg id="scene" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" hidden></svg>
    <div id="fx"></div>
    <div id="flash"></div>
    <button class="fab" id="fSound" aria-label="Sound on or off"></button>
    <button class="fab" id="fWand" aria-label="Surprise outfit"></button>
    <button class="fab" id="fExit" aria-label="Back" hidden></button>
    <button class="fab" id="fSnap" aria-label="Take a picture"></button>
  </div>
  <div id="panel">
    <div id="tabs"></div>
    <div id="content"></div>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const f1 = n => Math.round(n * 10) / 10;
const R = () => Math.random();
const pick = a => a[Math.floor(R() * a.length)];

/* ---------- palettes ---------- */
const SKIN = ['#ffe3d3', '#f8cfb0', '#efb98e', '#d89a6a', '#b97a4c', '#8e5a37', '#6a4128', '#4b2d1c'];
const EYES = ['#6b3f22', '#2e1f16', '#3d8bff', '#2fa35a', '#9c7a3c', '#8b5cf6', '#48a9a6'];
const HAIRC = ['#2b1d16', '#6b3f22', '#a0522d', '#f2c75c', '#fbe3a0', '#e8845e', '#ff8fc8', '#a57cf0', '#6fb7ff', '#5fdcb5', 'rainbow'];
const COLORS = ['#ff5c8a', '#ff9ecb', '#e63946', '#ff9f43', '#ffd93d', '#7bd389', '#2ec4b6', '#4cc9f0', '#4361ee', '#9d4edd', '#c8a2ff', '#ffffff', '#3d3d4e', '#f6c453', 'rainbow'];
const PATS = ['plain', 'dots', 'stripes', 'hearts', 'stars', 'flowers'];
const LIPS = ['#e63946', '#ff5d8f', '#ff8fab', '#c9184a', '#b5179e', '#ff9e5e', '#9d4edd', '#a0522d'];
const BLUSH = ['#ff8fab', '#ffa69e', '#ff6f91', '#f4a3c1', '#e0aaff', '#ffb38a'];
const SHADOW = ['#9d4edd', '#4cc9f0', '#72efdd', '#ffd166', '#ff8fab', '#80ed99', '#c77dff', '#f6c453'];
const NAILS = ['#ff5c8a', '#e63946', '#ff9ecb', '#9d4edd', '#4cc9f0', '#7bd389', '#ffd93d', '#f6c453'];

/* ---------- drawing helpers ---------- */
function sh(c, a) {
  if (c === 'rainbow') return a < 0 ? '#a45cc4' : '#ffc8e6';
  const n = parseInt(c.slice(1), 16), rgb = [n >> 16, (n >> 8) & 255, n & 255];
  return '#' + rgb.map(x => Math.round(a < 0 ? x * (1 + a) : x + (255 - x) * a).toString(16).padStart(2, '0')).join('');
}
function lum(c) {
  if (c === 'rainbow') return .6;
  const n = parseInt(c.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}
const fill = c => c === 'rainbow' ? 'url(#rainbow)' : c;
const solid = c => c === 'rainbow' ? '#ff9ecb' : c;
const patUrl = (p, c) => p && p !== 'plain' ? `url(#p-${p}-${lum(c) > .72 ? 'k' : 'w'})` : null;
const mirror = s => `<g transform="translate(400 0) scale(-1 1)">${s}</g>`;
const both = s => s + mirror(s);
const cpath = (x, y, r) => `M${x - r} ${y} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
function F(d, c, p, extra = '') {
  let s = `<path d="${d}" fill="${fill(c)}" stroke="${sh(c, -.25)}" stroke-width="3" stroke-linejoin="round" ${extra}/>`;
  const u = patUrl(p, c); if (u) s += `<path d="${d}" fill="${u}" ${extra}/>`;
  return s;
}
function S(d, c, p, w) {
  let s = `<path d="${d}" fill="none" stroke="${sh(c, -.25)}" stroke-width="${w + 6}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${fill(c)}" stroke-width="${w}" stroke-linecap="round"/>`;
  const u = patUrl(p, c); if (u) s += `<path d="${d}" fill="none" stroke="${u}" stroke-width="${w}" stroke-linecap="round"/>`;
  return s;
}
function scal(x1, x2, y, n, dp) {
  let s = ''; const w = (x2 - x1) / n;
  for (let i = 0; i < n; i++) { const xa = x1 + w * i, xb = xa + w; s += ` Q${f1((xa + xb) / 2)} ${y + dp * 2} ${f1(xb)} ${y}`; }
  return s;
}
const heart = (x, y, s) => `M${f1(x)} ${f1(y + s * .95)} C${f1(x - s * 1.7)} ${f1(y - s * .1)} ${f1(x - s * .8)} ${f1(y - s * 1.35)} ${f1(x)} ${f1(y - s * .45)} C${f1(x + s * .8)} ${f1(y - s * 1.35)} ${f1(x + s * 1.7)} ${f1(y - s * .1)} ${f1(x)} ${f1(y + s * .95)}Z`;
function star(x, y, R1, r1, n = 5) {
  let d = '';
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r1 : R1; d += (i ? 'L' : 'M') + f1(x + Math.cos(a) * rr) + ' ' + f1(y + Math.sin(a) * rr); }
  return d + 'Z';
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function blob(cx, cy, r, n, amp, rnd, bumpy) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rr = bumpy ? r * (1 + (i % 2 ? amp : -amp * .3)) : r * (1 + (rnd() * 2 - 1) * amp);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const s0 = mid(pts[n - 1], pts[0]); let d = `M${f1(s0[0])} ${f1(s0[1])}`;
  for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); d += ` Q${f1(pts[i][0])} ${f1(pts[i][1])} ${f1(m[0])} ${f1(m[1])}`; }
  return d + 'Z';
}
function union(shapes, c) { // one outline around overlapping shapes
  const st = sh(c, -.3), fl = fill(c);
  return shapes.map(d => `<path d="${d}" fill="${st}" stroke="${st}" stroke-width="6" stroke-linejoin="round"/>`).join('') +
         shapes.map(d => `<path d="${d}" fill="${fl}"/>`).join('');
}

/* ---------- defs: patterns + gradients ---------- */
(function defs() {
  const motif = {
    dots: c => `<circle cx="6" cy="6" r="3.6" fill="${c}"/><circle cx="19" cy="19" r="3.6" fill="${c}"/>`,
    stripes: c => `<rect x="0" y="0" width="8" height="26" fill="${c}"/>`,
    hearts: c => `<path d="${heart(13, 12, 5.5)}" fill="${c}"/>`,
    stars: c => `<path d="${star(13, 13, 7, 3)}" fill="${c}"/>`,
    flowers: c => [0, 1, 2, 3, 4].map(i => { const a = i / 5 * Math.PI * 2; return `<circle cx="${f1(13 + Math.cos(a) * 4.5)}" cy="${f1(13 + Math.sin(a) * 4.5)}" r="3.3" fill="${c}"/>`; }).join('') + `<circle cx="13" cy="13" r="2.4" fill="#ffd93d"/>`
  };
  let s = '';
  for (const [k, fn] of Object.entries(motif)) for (const [v, col] of [['w', 'rgba(255,255,255,.72)'], ['k', 'rgba(60,20,80,.2)']])
    s += `<pattern id="p-${k}-${v}" width="26" height="26" patternUnits="userSpaceOnUse"${k === 'stripes' ? ' patternTransform="rotate(40)"' : ''}>${fn(col)}</pattern>`;
  s += `<linearGradient id="rainbow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7b9c"/><stop offset=".2" stop-color="#ffb26b"/><stop offset=".4" stop-color="#ffe66d"/><stop offset=".6" stop-color="#7bd389"/><stop offset=".8" stop-color="#6fb7ff"/><stop offset="1" stop-color="#b388ff"/></linearGradient>`;
  s += `<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd8ff"/><stop offset="1" stop-color="#e9f9ff"/></linearGradient>`;
  s += `<linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7b3ff"/><stop offset="1" stop-color="#ffd9ec"/></linearGradient>`;
  s += `<linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1f5e"/><stop offset="1" stop-color="#4a3a8c"/></linearGradient>`;
  s += `<radialGradient id="gShine"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
  $('#defs').innerHTML = s;
})();

/* ---------- clothes ---------- */
const TORSO = 'M150 300 Q200 288 250 300 L240 400 Q242 425 246 448 L154 448 Q158 425 160 400 Z';
const CL = {
  dress: [
    { id: 'gown', c: '#c8a2ff', p: 'plain', box: '70 270 260 370', draw: (c, p) =>
      both(F(cpath(158, 314, 24), c, p)) +
      F('M152 300 Q200 290 248 300 L240 398 L308 600 Q200 632 92 600 L160 398 Z', c, p) +
      `<path d="M186 412 Q170 500 150 612 M214 412 Q230 500 250 612 M200 412 L200 620" stroke="${sh(c, -.22)}" stroke-width="3" fill="none" opacity=".55"/>` +
      F('M158 386 L242 386 L240 404 L160 404 Z', sh(solid(c), -.15)) +
      F('M200 395 L178 382 L178 410 Z M200 395 L222 382 L222 410 Z', sh(solid(c), -.15)) + `<circle cx="200" cy="395" r="6" fill="#ffd93d" stroke="#e0a800" stroke-width="2"/>` +
      [[150, 520], [248, 560], [196, 480], [120, 590], [270, 470]].map(([x, y]) => `<path d="${star(x, y, 7, 3, 4)}" fill="#fff" opacity=".85"/>`).join('') },
    { id: 'sundress', c: '#ffd93d', p: 'flowers', box: '80 270 240 290', draw: (c, p) =>
      both(`<path d="M168 306 L166 290" stroke="${sh(solid(c), -.2)}" stroke-width="9" stroke-linecap="round"/>`) +
      F('M160 304 Q200 298 240 304 L244 398 L286 522 Q200 540 114 522 L156 398 Z', c, p) +
      F('M156 390 L244 390 L244 404 L156 404 Z', '#ffffff') + `<circle cx="226" cy="397" r="10" fill="#ff5c8a"/><circle cx="226" cy="397" r="4" fill="#ffd93d"/>` },
    { id: 'party', c: '#ff9ecb', p: 'dots', box: '80 270 240 260', draw: (c, p) =>
      both(F(cpath(160, 314, 20), c, p)) +
      F('M154 394 L246 394 L298 494' + scal(298, 102, 494, 8, 9) + ' Z', '#ffffff') +
      F('M156 390 L244 390 L288 482' + scal(288, 112, 482, 8, 11) + ' Z', c, p) +
      F('M150 300 Q200 290 250 300 L244 398 L156 398 Z', c, p) +
      F('M156 386 L244 386 L244 402 L156 402 Z', sh(solid(c), -.15)) +
      F('M200 394 L176 380 L178 410 Z M200 394 L224 380 L222 410 Z', sh(solid(c), -.15)) },
    { id: 'unicorn', c: '#ffd6ec', p: 'plain', box: '80 270 240 260', draw: (c, p) =>
      both(F(cpath(160, 314, 20), c, p)) +
      F('M154 394 L246 394 L300 510' + scal(300, 100, 510, 8, 8) + ' Z', '#d9c2ff') +
      F('M156 390 L244 390 L292 500' + scal(292, 108, 500, 8, 10) + ' Z', '#b8dcff') +
      F('M156 390 L244 390 L278 468' + scal(278, 122, 468, 7, 9) + ' Z', '#b5f0c8') +
      F('M156 390 L244 390 L265 438' + scal(265, 135, 438, 6, 8) + ' Z', '#ffe29a') +
      F('M150 300 Q200 290 250 300 L244 398 L156 398 Z', c, p) +
      F('M156 386 L244 386 L244 402 L156 402 Z', '#d9c2ff') +
      `<path d="${star(200, 394, 13, 6)}" fill="#f6c453" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>` +
      [[140, 482], [258, 486], [200, 456], [168, 424], [232, 428]].map(([x, y]) => `<path d="${star(x, y, 6, 2.5, 4)}" fill="#fff"/>`).join('') },
    { id: 'pajamas', c: '#8fb8ff', p: 'stars', box: '90 270 220 360', draw: (c, p) =>
      F('M158 396 L242 396 L247 614 L206 614 L200 470 L194 614 L153 614 Z', c, p) +
      both(S('M158 310 Q132 372 125 430', c, p, 36)) +
      F('M148 299 Q200 288 252 299 L250 424 L150 424 Z', c, p) +
      F('M178 294 Q200 318 222 294 L214 290 Q200 306 186 290 Z', '#ffffff') +
      [330, 362, 394].map(y => `<circle cx="200" cy="${y}" r="5" fill="#fff" stroke="${sh(solid(c), -.3)}" stroke-width="2"/>`).join('') }
  ],
  top: [
    { id: 'tee', c: '#4cc9f0', p: 'plain', box: '96 280 208 150', draw: (c, p, k) =>
      both(S('M158 310 Q149 332 143 352', c, p, 40)) +
      F('M149 299 Q200 289 251 299 L247 410 L153 410 Z', c, p) +
      `<path d="M176 294 Q200 322 224 294 Q200 289 176 294 Z" fill="${k}" stroke="${sh(solid(c), -.25)}" stroke-width="3"/>` +
      `<path d="${star(200, 355, 20, 9)}" fill="#fff" opacity=".9"/>` },
    { id: 'cami', c: '#ff9ecb', p: 'hearts', box: '96 280 208 150', draw: (c, p) =>
      both(`<path d="M166 305 L164 292" stroke="${sh(solid(c), -.2)}" stroke-width="8" stroke-linecap="round"/>`) +
      F('M156 304 Q200 296 244 304 L250 408' + scal(250, 150, 408, 6, 6) + ' Z', c, p) +
      `<path d="M188 304 L200 316 L212 304" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>` },
    { id: 'sweater', c: '#9d4edd', p: 'stripes', box: '96 280 208 170', draw: (c, p) =>
      both(S('M158 310 Q132 372 125 426', c, p, 36) + S('M126 424 L124 434', sh(solid(c), -.12), null, 36)) +
      F('M148 299 Q200 288 252 299 L248 412 L152 412 Z', c, p) +
      F('M152 400 L248 400 L248 416 L152 416 Z', sh(solid(c), -.12)) +
      F('M178 288 Q200 298 222 288 L224 300 Q200 314 176 300 Z', sh(solid(c), -.12)) },
    { id: 'blouse', c: '#ffffff', p: 'plain', box: '96 280 208 150', draw: (c, p) =>
      both(F(cpath(158, 316, 24), c, p)) +
      F('M150 300 Q200 290 250 300 L246 408 L154 408 Z', c, p) +
      both(`<path d="M200 300 Q180 294 170 300 Q172 322 198 316 Z" fill="#ffd6e8" stroke="#e79ab8" stroke-width="2.5"/>`) +
      F('M200 312 L184 302 L184 324 Z M200 312 L216 302 L216 324 Z', '#ff5c8a') + `<circle cx="200" cy="312" r="5" fill="#ff5c8a"/>` +
      [340, 366, 392].map(y => `<circle cx="200" cy="${y}" r="4" fill="${sh(solid(c), -.3)}"/>`).join('') }

const vBuf = {}; let vSrc = null;
function hushVoice() { if (vSrc) { try { vSrc.stop(); } catch (e) {} vSrc = null; } try { speechSynthesis.cancel(); } catch (e) {} }

  if (vBuf[t]) { go(vBuf[t]); return true; }

}

function wear(id) {

    const it = BY.acc[id]; st.acc[id] = { c: it.c, p: it.p }; ui.accSel = id; applied('acc'); return;
  }
  const cur = st.wear[cat];
  if (cur && cur.id === id) { st.wear[cat] = null; sfx.tap(); renderDoll(); save(); jump(); return; }
  const it = BY[cat][id];
  st.wear[cat] = { id, c: it.c, p: it.p };

function mudSpots() {

  });

const TOOLKEY = { petbath: 'bath', petbrush: 'hairbrush', pettowel: 'towel' };
const sparkly = k => k === 'hairbrush' || k === 'petbrush' || k === 'pettowel';
const ACT_TALK = { petbath: ['Muddy paws! Scrub scrub!', 'All clean! Good PET!'], petbrush: ['Brush out the fluffy tangles!', 'So soft and fluffy!'], pettowel: ['Brrr, all wet! Dry dry dry!', 'Warm and dry! Good PET!'], bath: ['Uh oh, muddy! Rub rub rub!', 'Squeaky clean!'], teeth: ['Brush away the sugar bugs!', 'Shiny sparkly teeth!'], hands: ['Scrub scrub! Wash the germs away!', 'Clean hands! Yay!'], hairbrush: ['Brush out the tangles!', 'Pretty smooth hair!'] };
function startAct(kind) {

stage.addEventListener('pointerdown', e => {
  ac();
